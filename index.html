
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tarot AI</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <!-- Экран выбора карты -->
        <div id="cards-screen" class="screen active">
            <h2>✨ Выбери карту Таро ✨</h2>
            <div id="cards-container"></div>
            <button id="draw-button" disabled>Получить предсказание</button>
            <p id="questions-left">Оплачено вопросов: 0</p>
            <button id="buy-button" style="display:none;">Купить вопрос за 1 SILARUM</button>
        </div>
        <!-- Экран результата -->
        <div id="result-screen" class="screen">
            <div id="card-emoji"></div>
            <div id="prediction-text"></div>
            <button id="back-button">Задать новый вопрос</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
