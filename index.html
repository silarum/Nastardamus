<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nastardamus</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <canvas id="magic-canvas"></canvas>

    <!-- Приветственный экран -->
    <div id="welcome-screen" class="screen active">
        <div class="welcome-overlay">
            <div class="welcome-content">
                <h1 id="title-animated" class="title-glow">Nastardamus</h1>
                <p class="mage-name">Вас приветствует Маг Эзотериум</p>
                <p class="mage-desc">Ясновидящий, астролог, повелитель Таро</p>
                <button id="continue-btn" class="magic-btn">Войти в мир тайн</button>
            </div>
        </div>
    </div>

    <!-- Главное меню -->
    <div id="menu-screen" class="screen">
        <div class="menu-content">
            <h1 class="title">✨ Nastardamus ✨</h1>
            <p class="mage-tag">Маг Эзотериум</p>
            <div class="menu-buttons">
                <button id="go-tarot" class="menu-btn">🔮 Расклад Таро</button>
                <button id="go-natal" class="menu-btn">🌌 Натальная карта</button>
                <button id="go-compat" class="menu-btn">💞 Совместимость</button>
            </div>
        </div>
    </div>

    <!-- Вопрос для Таро -->
    <div id="tarot-input-screen" class="screen">
        <div class="panel">
            <h2 class="mystical-text">Поведайте свою тайну</h2>
            <textarea id="tarot-question" placeholder="Что тревожит вашу душу?"></textarea>
            <button id="start-tarot" class="magic-btn">Разбудить колоду</button>
            <button class="back-btn" data-target="menu-screen">← Назад</button>
        </div>
    </div>

    <!-- Интерактивная колода -->
    <div id="tarot-cards-screen" class="screen">
        <div class="panel">
            <h2 class="mystical-text">Дважды коснитесь карты</h2>
            <div id="carousel-container">
                <div id="card-carousel"></div>
            </div>
            <p id="cards-left" class="mystical-text"></p>
            <div id="selected-cards"></div>
        </div>
    </div>

    <!-- Результат Таро -->
    <div id="tarot-result-screen" class="screen">
        <div class="panel">
            <div id="result-cards"></div>
            <div id="prediction-text" class="scroll-box"></div>
            <button class="back-btn" data-target="menu-screen">← В меню</button>
        </div>
    </div>

    <!-- Натальная карта -->
    <div id="natal-input-screen" class="screen">
        <div class="panel">
            <h2 class="mystical-text">Звёзды ждут</h2>
            <input type="date" id="natal-date">
            <input type="time" id="natal-time" value="12:00">
            <button id="get-natal" class="magic-btn">Открыть гороскоп</button>
            <button class="back-btn" data-target="menu-screen">← Назад</button>
        </div>
    </div>
    <div id="natal-result-screen" class="screen">
        <div class="panel">
            <div id="natal-text" class="scroll-box"></div>
            <button class="back-btn" data-target="menu-screen">← В меню</button>
        </div>
    </div>

    <!-- Совместимость -->
    <div id="compat-input-screen" class="screen">
        <div class="panel">
            <h2 class="mystical-text">Союз сердец</h2>
            <input type="text" id="person1-name" placeholder="Имя первого">
            <input type="date" id="person1-date">
            <input type="text" id="person2-name" placeholder="Имя второго">
            <input type="date" id="person2-date">
            <button id="get-compat" class="magic-btn">Проверить совместимость</button>
            <button class="back-btn" data-target="menu-screen">← Назад</button>
        </div>
    </div>
    <div id="compat-result-screen" class="screen">
        <div class="panel">
            <div id="compat-text" class="scroll-box"></div>
            <button class="back-btn" data-target="menu-screen">← В меню</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
