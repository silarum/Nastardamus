<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Nastardamus — Таро, фото-чтения, натальные подсказки и личное пространство в Telegram.">
  <meta name="theme-color" content="#070913">
  <meta name="color-scheme" content="dark">
  <title>Nastardamus — пространство знаков</title>
  <script src="./ui-kit/canonical-entry.js"></script>
  <link rel="preload" href="/images/splash-v2.webp" as="image" fetchpriority="high">
  <link rel="stylesheet" href="/ui-kit/tokens.css">
  <link rel="stylesheet" href="/ui-kit/components.css">
  <link rel="stylesheet" href="/ui-kit/app.css">
  <style>
    .boot-screen{position:fixed;inset:0;z-index:999;overflow:hidden;background:radial-gradient(circle at 50% 18%,#34204e 0,#111328 42%,#070913 82%);color:#f8d98b;transition:opacity .25s}
    .boot-screen.is-hidden{opacity:0;pointer-events:none}
    .boot-screen__art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
    .boot-screen__shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,16,.02) 18%,rgba(5,7,16,.32) 54%,#070913 88%)}
    .boot-screen__content{position:absolute;right:0;bottom:0;left:0;display:grid;justify-items:center;gap:8px;padding:24px 20px calc(28px + env(safe-area-inset-bottom,0));text-align:center}
    .boot-screen__brand{display:flex;align-items:center;gap:9px;color:#f8d98b;font:600 29px/1 Georgia,serif}
    .boot-screen__brand img{width:31px;height:31px;object-fit:contain}
    .boot-screen__content p{margin:0;color:#d8c8df;font:700 10px/1.3 system-ui,sans-serif;letter-spacing:.12em}
    .boot-screen__status{min-height:15px;max-width:310px;letter-spacing:.02em!important;text-transform:none;font-weight:500!important;line-height:1.45!important}
    .boot-screen__retry{margin-top:7px;padding:10px 18px;border:1px solid #d9ae58;border-radius:999px;background:rgba(13,12,25,.76);color:#f4d685;font:700 12px/1 system-ui,sans-serif}
    .boot-screen__loader{width:30px;height:30px;margin-top:4px;border:1px solid #b98238;border-radius:50%;box-shadow:0 0 24px #7227a8;animation:boot 1.2s linear infinite}
    .boot-screen__loader::after{content:"✦";display:grid;place-items:center;height:100%;font:400 14px/1 Georgia,serif}
    @keyframes boot{to{transform:rotate(360deg)}}
  </style>
  <script defer src="/ui-kit/telegram-entry-gate.js"></script>
  <script defer src="/ui-kit/app.bundle.js"></script>
  <script async id="telegram-web-app-sdk" src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="boot-screen" class="boot-screen" aria-label="Nastardamus загружается">
    <img class="boot-screen__art" src="/images/splash-v2.webp" alt="" fetchpriority="high">
    <div class="boot-screen__shade"></div>
    <div class="boot-screen__content">
      <div class="boot-screen__brand">
        <img src="/ui-kit/assets/art-v2/brand-sun.webp" alt="">
        <span>Nastardamus</span>
      </div>
      <p>ПРОСТРАНСТВО ЭЗОТЕРИУМА</p>
      <span class="boot-screen__loader" aria-hidden="true"></span>
      <p class="boot-screen__status" data-boot-status>Загружаем интерфейс и изображения…</p>
      <button class="boot-screen__retry" type="button" data-boot-retry hidden>Повторить загрузку</button>
    </div>
  </div>
  <div id="premium-app"></div>
  <div id="premium-toast" class="premium-toast" role="status" aria-live="polite"></div>
</body>
</html>
