<!-- КОШЕЛЁК -->
<div id="wallet-screen" class="screen">
    <div class="panel">
        <h2 class="mystical-text">💰 Мой кошелёк</h2>
        
        <div class="wallet-balance">
            <div class="balance-amount"><span id="wallet-balance">0</span> SILARUM</div>
        </div>
        
        <div class="wallet-actions">
            <button id="go-buy-silarum" class="magic-btn">💳 Купить силарумы</button>
            <button id="go-exchange" class="magic-btn">🔄 Обменять на крипту</button>
        </div>
        
        <div id="exchange-info" class="info-box" style="display:none;">
            <p>📌 Курс: 1 SILARUM = 100 ₽</p>
            <p>📌 Срок обмена: 14 дней</p>
            <p>📌 Комиссия: 10%</p>
            <p>📌 Доступно: BTC, LTC, TON, USDT</p>
        </div>
        
        <button class="back-btn" data-target="menu-screen">← В меню</button>
    </div>
</div>

<!-- ПОКУПКА СИЛАРУМОВ -->
<div id="buy-silarum-screen" class="screen">
    <div class="panel">
        <h2 class="mystical-text">💳 Купить силарумы</h2>
        
        <label class="input-label">Количество силарумов:</label>
        <input type="number" id="buy-amount" value="1" min="1" max="100">
        
        <div class="info-box">
            <p>💰 К оплате: <b><span id="buy-rub-amount">100</span> ₽</b></p>
            <p>📌 1 SILARUM = 100 ₽</p>
        </div>
        
        <label class="input-label">Способ оплаты:</label>
        <select id="payment-method">
            <option value="sbp">📱 СБП (по номеру телефона)</option>
            <option value="card">💳 Перевод на карту</option>
        </select>
        
        <button id="create-payment" class="magic-btn">Перейти к оплате</button>
        <button class="back-btn" data-target="wallet-screen">← Назад</button>
    </div>
</div>

<!-- ИНСТРУКЦИЯ ПО ОПЛАТЕ -->
<div id="payment-instruction-screen" class="screen">
    <div class="panel">
        <h2 class="mystical-text">📋 Инструкция по оплате</h2>
        
        <div id="payment-details" class="scroll-box"></div>
        
        <div class="info-box">
            <p>⚠️ <b>Важно!</b> В сообщении к переводу укажите код платежа.</p>
        </div>
        
        <button id="payment-done" class="magic-btn">✅ Я оплатил</button>
        <button class="back-btn" data-target="buy-silarum-screen">← Назад</button>
    </div>
</div>

<!-- ОБМЕН СИЛАРУМОВ -->
<div id="exchange-screen" class="screen">
    <div class="panel">
        <h2 class="mystical-text">🔄 Обмен силарумов</h2>
        
        <label class="input-label">Сумма силарумов:</label>
        <input type="number" id="exchange-amount" value="50" min="50" max="1000">
        
        <label class="input-label">Получить валюту:</label>
        <select id="exchange-currency">
            <option value="BTC">₿ Bitcoin (BTC)</option>
            <option value="LTC">Ł Litecoin (LTC)</option>
            <option value="TON">💎 Toncoin (TON)</option>
            <option value="USDT">💵 Tether (USDT TRC-20)</option>
        </select>
        
        <button id="calculate-exchange" class="magic-btn">Рассчитать</button>
        
        <div id="exchange-result" class="scroll-box" style="display:none;"></div>
        
        <button class="back-btn" data-target="wallet-screen">← Назад</button>
    </div>
</div>
