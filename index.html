<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nastardamus</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="magic-bg">
        <div class="rune-circle"></div>
        <div class="rune-circle small"></div>
        <div class="stars"></div>
    </div>

    <!-- Приветственный экран (без поля API) -->
    <div id="welcome-screen" class="screen active">
        <div class="welcome-box">
            <h1 id="title-animated" class="title-glow">Nastardamus</h1>
            <p class="mage-name">Вас приветствует Маг Эзотериум</p>
            <p class="mage-desc">Ясновидящий, астролог, повелитель Таро</p>
            <button id="continue-btn" class="magic-btn">Войти в мир тайн</button>
        </div>
    </div>

    <!-- Меню -->
    <div id="menu-screen" class="screen">
        <h1 class="title">✨ Nastardamus ✨</h1>
        <p class="mage-tag">Маг Эзотериум</p>
        <div class="menu-buttons">
            <button id="tarot-btn" class="menu-btn">🔮 Расклад Таро</button>
            <button id="natal-btn" class="menu-btn">🌌 Натальная карта</button>
            <button id="compat-btn" class="menu-btn">💞 Совместимость</button>
        </div>
    </div>

    <!-- Таро: вопрос -->
    <div id="tarot-input-screen" class="screen">
        <h2>Задайте вопрос магу</h2>
        <textarea id="tarot-question" placeholder="Что вас волнует?"></textarea>
        <button id="start-tarot" class="magic-btn">Тасовать карты</button>
        <button class="back-btn" data-target="menu-screen">← Назад</button>
    </div>

    <!-- Таро: выбор карт -->
    <div id="tarot-cards-screen" class="screen">
        <h2>Коснитесь колоды трижды</h2>
        <div id="deck-container">
            <div id="deck" class="magic-deck"></div>
            <canvas id="spark-canvas"></canvas>
        </div>
        <p id="cards-left"></p>
        <div id="selected-cards"></div>
    </div>

    <!-- Таро: результат -->
    <div id="tarot-result-screen" class="screen">
        <div id="result-cards"></div>
        <div id="prediction-text" class="scroll-box"></div>
        <button class="back-btn" data-target="menu-screen">← В меню</button>
    </div>

    <!-- Натальная карта -->
    <div id="natal-input-screen" class="screen">
        <h2>Натальная карта</h2>
        <input type="date" id="natal-date">
        <input type="time" id="natal-time" value="12:00">
        <button id="get-natal" class="magic-btn">Рассчитать</button>
        <button class="back-btn" data-target="menu-screen">← Назад</button>
    </div>
    <div id="natal-result-screen" class="screen">
        <div id="natal-text" class="scroll-box"></div>
        <button class="back-btn" data-target="menu-screen">← В меню</button>
    </div>

    <!-- Совместимость -->
    <div id="compat-input-screen" class="screen">
        <h2>Совместимость</h2>
        <input type="text" id="person1-name" placeholder="Имя первого">
        <input type="date" id="person1-date">
        <input type="text" id="person2-name" placeholder="Имя второго">
        <input type="date" id="person2-date">
        <button id="get-compat" class="magic-btn">Узнать</button>
        <button class="back-btn" data-target="menu-screen">← Назад</button>
    </div>
    <div id="compat-result-screen" class="screen">
        <div id="compat-text" class="scroll-box"></div>
        <button class="back-btn" data-target="menu-screen">← В меню</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
