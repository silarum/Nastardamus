<svg xmlns="http://www.w3.org/2000/svg" width="360" height="600" viewBox="0 0 360 600" role="img" aria-label="Семёрка — Мечи">
  <defs>
    <radialGradient id="bg"><stop stop-color="#281138"/><stop offset=".6" stop-color="#100a1d"/><stop offset="1" stop-color="#050710"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0b3"/><stop offset=".45" stop-color="#cbd5ff"/><stop offset="1" stop-color="#79501d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="stars" width="53" height="61" patternUnits="userSpaceOnUse"><circle cx="8" cy="13" r=".8" fill="#fff1ba"/><circle cx="39" cy="44" r=".65" fill="#a77ef1"/></pattern>
    <style>
      .sigil{font:46px Georgia,serif;fill:url(#gold);filter:url(#glow)}
      .court{font:126px Georgia,serif;fill:url(#gold);filter:url(#glow)}
      .rank{font:600 24px Georgia,serif;fill:#ffe6a1;letter-spacing:1px}
      .suit{font:500 16px system-ui,sans-serif;fill:#c7b8d3;letter-spacing:3px;text-transform:uppercase}
    </style>
  </defs>
  <rect width="360" height="600" rx="22" fill="url(#bg)"/>
  <rect x="8" y="8" width="344" height="584" rx="17" fill="url(#stars)" opacity=".52" stroke="url(#gold)" stroke-width="2"/>
  <rect x="20" y="20" width="320" height="560" rx="12" fill="none" stroke="#5e63d7" stroke-width="1" opacity=".7"/>
  <path d="M45 92Q180 28 315 92M45 508Q180 572 315 508" fill="none" stroke="url(#gold)" opacity=".56"/>
  <circle cx="180" cy="300" r="138" fill="#5e63d7" opacity=".06"/>
  <text x="110" y="160" text-anchor="middle" class="sigil" opacity="0.78">†</text><text x="250" y="160" text-anchor="middle" class="sigil" opacity="0.86">†</text><text x="180" y="245" text-anchor="middle" class="sigil" opacity="0.9400000000000001">†</text><text x="110" y="320" text-anchor="middle" class="sigil" opacity="0.78">†</text><text x="250" y="320" text-anchor="middle" class="sigil" opacity="0.86">†</text><text x="140" y="405" text-anchor="middle" class="sigil" opacity="0.9400000000000001">†</text><text x="220" y="405" text-anchor="middle" class="sigil" opacity="0.78">†</text>
  <text x="180" y="67" text-anchor="middle" class="rank">Семёрка</text>
  <text x="180" y="548" text-anchor="middle" class="suit">Мечи</text>
  <text x="36" y="53" class="sigil" font-size="20">†</text>
  <text x="324" y="565" text-anchor="end" class="sigil" font-size="20">†</text>
</svg>